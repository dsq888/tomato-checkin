{% extends "base.html" %}
{% block title %}{{ code }} - 番茄打卡{% endblock %}
{% block content %}
<div class="form">
    <div class="card" style="text-align: center;">
        <div style="font-size: 64px; margin-bottom: 8px;">🍅</div>
        <div style="font-size: 72px; font-weight: 700; color: var(--tomato); margin: 16px 0;">{{ code }}</div>
        <div style="font-size: 18px; color: var(--text-secondary); margin-bottom: 24px;">{{ msg }}</div>
        <a href="/" class="btn btn-primary">返回首页</a>
    </div>
</div>
{% endblock %}
