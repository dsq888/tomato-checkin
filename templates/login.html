{% extends "base.html" %}
{% block title %}番茄打卡 - 登录{% endblock %}
{% block content %}
<div class="form">
    <div class="card">
        <div class="card-header text-center" style="padding-bottom: 0.5rem;">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">🍅</div>
            <h2 style="color: var(--tomato); margin: 0; font-weight: 600;">番茄打卡 - 登录</h2>
        </div>
        {% if msg %}<div class="msg msg-success">{{ msg }}</div>{% endif %}
        {% if error %}<div class="msg msg-error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
        <div class="form-footer">还没有账号？<a href="/register">立即注册</a></div>
    </div>
</div>
{% endblock %}
