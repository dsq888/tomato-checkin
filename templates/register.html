{% extends "base.html" %}
{% block title %}番茄打卡 - 注册{% endblock %}
{% block content %}
<div class="form">
    <div class="card">
        <div class="card-header text-center" style="padding-bottom: 0.5rem;">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">🍅</div>
            <h2 style="color: var(--tomato); margin: 0; font-weight: 600;">番茄打卡 - 注册</h2>
        </div>
        {% if error %}<div class="msg msg-error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>用户名（2-20位，字母/数字/下划线/中文）</label>
                <input type="text" name="username" required autofocus minlength="2" maxlength="20">
            </div>
            <div class="form-group">
                <label>昵称（可选，最多30字符）</label>
                <input type="text" name="nickname" placeholder="不填则使用用户名" maxlength="30">
            </div>
            <div class="form-group">
                <label>密码（6-64位）</label>
                <input type="password" name="password" required minlength="6" maxlength="64">
            </div>
            <button type="submit" class="btn btn-primary btn-block">注册</button>
        </form>
        <div class="form-footer">已有账号？<a href="/login">立即登录</a></div>
    </div>
</div>
{% endblock %}
